# Online co-op between two simulated home networks (tools/nat_sim.sh): the host in one home, the
# joiner in another, each behind its own NAT router, with matchmaking and STUN on a pretend internet.
# Shows which router combinations connect directly. The "relay" run links the pretend internet to
# the real one and uses the game's own servers, so the real TURN relay has to rescue two strict homes
# (it needs the repository secrets TURN_USERNAME and TURN_CREDENTIAL).
name: Two-homes NAT test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/nat-test.yml', 'tools/nat_sim.sh', 'game/core/online_room.gd']
jobs:
  nat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {home1: cone, home2: cone, relay: false}
          - {home1: cone, home2: symmetric, relay: false}
          - {home1: symmetric, home2: symmetric, relay: false}
          - {home1: symmetric, home2: symmetric, relay: true}
    name: ${{ matrix.home1 }} + ${{ matrix.home2 }}${{ matrix.relay && ' + relay' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot, OpenXR vendors plugin, WebRTC, coturn
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$HOME/bin" && unzip -q godot.zip && mv Godot_v4.7.2-stable_linux.x86_64 "$HOME/bin/godot"
          curl -fsSL -o vendors.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip"
          unzip -q vendors.zip -d vendors && cp -r vendors/asset/addons/godotopenxrvendors game/addons/
          sh tools/fetch_webrtc.sh
          sudo apt-get install -y -qq coturn python3-websockets tcpdump conntrack > /dev/null
          "$HOME/bin/godot" --headless --path game --import > import.log 2>&1 || true
      - name: TURN relay login (repository secrets TURN_USERNAME, TURN_CREDENTIAL)
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          if [ -n "$TURN_USERNAME" ]; then
            printf '[turn]\nurl="%s"\nusername="%s"\ncredential="%s"\n' "${TURN_URL:-turn:free.expressturn.com:3478}" "$TURN_USERNAME" "$TURN_CREDENTIAL" > game/turn.cfg
            echo "relay login added"
          else
            echo "::warning::No TURN secrets: this build has no relay for strict networks"
          fi
      - name: Build the two homes and the pretend internet
        run: |
          sudo sh tools/nat_sim.sh up ${{ matrix.home1 }} ${{ matrix.home2 }} ${{ matrix.relay && 'internet' || '' }}
          sudo ip netns exec inet python3 tools/mqtt_ws_broker.py 8899 203.0.113.10 > broker.log 2>&1 &
          sudo ip netns exec inet turnserver -n --no-cli --log-file=stdout -L 203.0.113.10 --listening-port=3478 \
            --stun-only > turn.log 2>&1 &     # the pretend internet's STUN server
          sleep 2
      - name: Host in home 1, join from home 2
        run: |
          set +e +o pipefail
          ice="--ice=stun:203.0.113.10:3478"
          [ "${{ matrix.relay }}" = "true" ] && ice=""     # the game's own STUN and TURN servers
          sig="--signal=ws://203.0.113.10:8899/mqtt"
          run_in() { ns=$1; shift; sudo ip netns exec "$ns" sudo -u "$USER" env "HOME=$HOME" "$HOME/bin/godot" "$@"; }
          # Watch the UDP crossing the pretend internet (for diagnosis).
          sudo ip netns exec inet timeout 70 tcpdump -lnni br0 udp > tcpdump.txt 2>&1 &
          cd game
          (run_in h1 --headless --path . -- --desktop --host-online --room=NATTT $sig $ice --autotest=net_host > ../host.log 2>&1; echo $? > ../host.exit) &
          sleep 6
          run_in h2 --headless --path . -- --desktop --join-code=NATTT2 $sig $ice --autotest=net_client > ../client.log 2>&1; echo $? > ../client.exit
          wait
          if grep -q "connected to the host" ../client.log; then result="CONNECTED"; else result="COULD NOT CONNECT"; fi
          echo "### ${{ matrix.home1 }} + ${{ matrix.home2 }}${{ matrix.relay && ' + relay' || '' }}: $result" >> "$GITHUB_STEP_SUMMARY"
          echo "RESULT: $result"
          echo "--- host"; grep -hE "^PASS|^FAIL|AUTOTEST done|\[ONLINE\]|\[RIPPLE\]" ../host.log
          echo "--- joiner"; grep -hE "^PASS|^FAIL|AUTOTEST done|\[ONLINE\]|\[RIPPLE\]" ../client.log
          echo "--- joiner errors"; grep -iE "error|webrtc|ice" ../client.log | grep -v OpenXR | sort | uniq -c | head -8
          echo "--- UDP flows on the pretend internet (packets, from > to)"
          awk '/ IP /{print $3, ">", $5}' ../tcpdump.txt | sed 's/:$//' | sort | uniq -c | sort -rn | head -25
          echo "--- router 1 NAT"; sudo ip netns exec r1 iptables -t nat -L POSTROUTING -v -n
          echo "--- router 1 forward"; sudo ip netns exec r1 iptables -L FORWARD -v -n
          echo "--- router 1 conntrack (udp)"; sudo ip netns exec r1 conntrack -L -p udp 2>/dev/null | head -12
          true
